const ORG='#ff7a00',COURSES=['C','F','A','D'],OPEN={C:48,F:53,A:57,D:62};
const M=DATA.map;
// ---- validator ----
function validate(s){const e=[];if(!s.events||!s.events.length)e.push('אין תווים בשיר');
 let prev=null;(s.events||[]).forEach((x,i)=>{const n='תו '+(i+1)+': ';
  if(!COURSES.includes(x.course))e.push(n+'מיתר לא חוקי "'+x.course+'"');
  if(!Number.isInteger(x.fret)||x.fret<0||x.fret>15)e.push(n+'שריג מחוץ לטווח 0–15 ('+x.fret+')');
  if(!(x.dur>0))e.push(n+'משך לא חוקי');
  if(x.pick!=='down'&&x.pick!=='up')e.push(n+'כיוון מפרט חסר');
  if(x.chord&&!s.chords[x.chord])e.push(n+'אקורד לא מוגדר '+x.chord);
  if(prev){if(x.t<prev.t)e.push(n+'זמנים לא ממוינים');
   if(Math.abs(x.fret-prev.fret)>9&&x.t-prev.t<0.2)e.push(n+'קפיצה לא הגיונית '+prev.fret+'→'+x.fret);}
  prev=x;});return e;}
// ---- layout (same as mockup v3) ----
const cv=document.getElementById('cv'),g=cv.getContext('2d');
const S=1.56,CY0=M.y0,OX=640-Math.round(195*S/2),OY=15,VIEW=1150;let X0=250,X0t=250;
const fx=f=>f===0?M.fret_x['0']:(M.fret_mid_x[f]??(M.fret_x['12']+(f-12)*70));
function pt(c,f){return [OX+(M.course_y[c]-CY0)*S, OY+(fx(f)-X0)*S];}
const PY=640,PPS=260,lanes={};COURSES.forEach((c,i)=>lanes[c]=75+i*70);
const neck=new Image();neck.src=NECK_SRC;
let song,evs,T=0,playing=false,speed=0.75,last=0,idx=-1,parts=[],cur=null,nxt=null,slide=1,last_t=performance.now();
function bg(){const gr=g.createLinearGradient(0,0,0,1920);gr.addColorStop(0,'#262628');gr.addColorStop(1,'#0c0c0e');g.fillStyle=gr;g.fillRect(0,0,1080,1920);}
function drawNeck(){g.save();g.shadowColor='rgba(0,0,0,.6)';g.shadowBlur=28;g.fillStyle='#000';g.fillRect(OX+8,OY,195*S,VIEW*S);g.restore();
 g.save();g.beginPath();g.rect(OX,OY,195*S,VIEW*S);g.clip();
 g.setTransform(0,S,S,0,OX,OY-X0*S);if(neck.complete)g.drawImage(neck,0,0);g.restore();
 g.font='700 30px Rubik,Arial';g.textAlign='center';g.textBaseline='middle';g.lineWidth=8;g.strokeStyle='#000';g.fillStyle='#fff';
 if(X0<330)COURSES.forEach(c=>{const[x,y]=pt(c,0);g.strokeText(c,x,y-30);g.fillText(c,x,y-30);});}
function pick(x,y,k,col){g.strokeStyle=col;g.lineWidth=3;g.beginPath();
 if(k==='down'){g.moveTo(x-9,y+8);g.lineTo(x-9,y-8);g.lineTo(x+9,y-8);g.lineTo(x+9,y+8);}else{g.moveTo(x-9,y-8);g.lineTo(x,y+9);g.lineTo(x+9,y-8);}g.stroke();}
function drawTab(){g.fillStyle='rgba(0,0,0,.43)';rr(40,40,280,1260,20);g.fill();
 g.strokeStyle='rgba(255,255,255,.16)';g.lineWidth=2;for(const c of COURSES){g.beginPath();g.moveTo(lanes[c],60);g.lineTo(lanes[c],1280);g.stroke();}
 g.font='700 30px Rubik,Arial';g.fillStyle='#c8c8c8';g.textAlign='center';for(const c of COURSES)g.fillText(c,lanes[c],75);
 g.save();g.beginPath();g.rect(40,100,280,1190);g.clip();
 for(const e of evs){const y=PY-(e.t-T)*PPS;if(y<40)break;const yt=y-(e.dur)*PPS;if(y>1340&&yt>1340)continue;
  const x=lanes[e.course],on=T>=e.t&&T<e.t+e.dur,past=T>=e.t+e.dur,col=on?ORG:(past?'rgba(255,255,255,.35)':'#fff');
  const sus=Math.max(0,e.dur*PPS-30);g.strokeStyle=col;g.lineWidth=4;g.beginPath();g.moveTo(x,y-24);g.lineTo(x,y-24-sus);g.stroke();
  if(on){g.fillStyle=ORG;g.beginPath();g.arc(x,y,26,0,7);g.fill();}
  g.font='700 34px Rubik,Arial';g.fillStyle=past?'rgba(255,255,255,.4)':'#fff';g.fillText(e.fret,x,y);pick(x-(e.course==='C'?30:38),y,e.pick,col);}
 g.restore();g.fillStyle='#fff';g.fillRect(0,PY-2,1080,4);}
function rr(x,y,w,h,r){g.beginPath();g.roundRect?g.roundRect(x,y,w,h,r):g.rect(x,y,w,h);}
function chord(x0,y0,w,name,fr,alpha,sc){if(!name)return;const h=w*1.25,a=alpha;g.save();g.globalAlpha=a;
 g.fillStyle='rgba(50,50,52,.92)';rr(x0,y0,w,h,22*sc);g.fill();g.fillStyle='#fff';g.textAlign='center';g.font=`700 ${46*sc}px Rubik,Arial`;g.fillText(name,x0+w/2,y0+40*sc);
 const gx0=x0+35*sc,gx1=x0+w-35*sc,gy0=y0+85*sc,fh=40*sc,pos=fr.filter(v=>v>0),base=pos.length?Math.min(...pos):1,sp=(gx1-gx0)/3;
 g.strokeStyle='#dcdcdc';g.lineWidth=2;for(let i=0;i<4;i++){g.beginPath();g.moveTo(gx0+i*sp,gy0);g.lineTo(gx0+i*sp,gy0+4*fh);g.stroke();}
 for(let j=0;j<5;j++){g.beginPath();g.moveTo(gx0,gy0+j*fh);g.lineTo(gx1,gy0+j*fh);g.stroke();}
 g.fillStyle='#dcdcdc';g.font=`700 ${20*sc}px Rubik,Arial`;g.textAlign='right';g.fillText(base,gx0-8*sc,gy0+fh/2);g.textAlign='center';
 fr.forEach((v,i)=>{const cx=gx0+i*sp;if(v>0){g.fillStyle=ORG;g.beginPath();g.arc(cx,gy0+(v-base+.5)*fh,13*sc,0,7);g.fill();}
  else{g.fillStyle='#dcdcdc';g.font=`700 ${22*sc}px Rubik,Arial`;g.fillText(v===0?'○':'×',cx,gy0-14*sc);}
  g.fillStyle='#c8c8c8';g.font=`700 ${18*sc}px Rubik,Arial`;g.fillText(COURSES[i],cx,gy0+4*fh+18*sc);});g.restore();}
function drawChords(){const p=1-Math.pow(1-slide,3),L=(a,b)=>a+(b-a)*p;
 if(cur)chord(L(880,830),L(370,60),L(150,220),cur,song.chords[cur],L(.68,1),L(.68,1));
 if(nxt)chord(880,L(560,370),150,nxt,song.chords[nxt],.68*p,.68);}
function drawDot(){if(idx<0)return;const e=evs[idx];const[X,Y]=pt(e.course,e.fret);
 g.save();g.shadowColor=ORG;g.shadowBlur=40;g.fillStyle='rgba(255,122,0,.55)';g.beginPath();g.arc(X,Y,30,0,7);g.fill();g.restore();
 for(const p of parts){g.globalAlpha=Math.max(0,p.l);g.fillStyle=p.c;g.beginPath();g.arc(p.x,p.y,p.s,0,7);g.fill();}g.globalAlpha=1;
 g.fillStyle=ORG;g.strokeStyle='#fff';g.lineWidth=3;g.beginPath();g.arc(X,Y,15,0,7);g.fill();g.stroke();
 g.fillStyle='#fff';g.font='700 20px Rubik,Arial';g.textAlign='center';g.fillText(e.fret,X,Y+1);}
function burst(){const e=evs[idx];const[X,Y]=pt(e.course,e.fret);for(let i=0;i<18;i++){const a=Math.random()*6.28,v=60+Math.random()*120;
 parts.push({x:X+Math.cos(a)*20,y:Y+Math.sin(a)*20,vx:Math.cos(a)*v,vy:Math.sin(a)*v,s:2+Math.random()*2.5,l:1,c:['#ffc85a','#fff',ORG][i%3]});}}
// ---- sound: Karplus-Strong, doubled courses ----
let AC=null;const cache={};
function ks(f,sr,len,bright){const N=Math.round(sr/f),buf=new Float32Array(len),d=new Float32Array(N);
 for(let i=0;i<N;i++)d[i]=(Math.random()*2-1)*(i<N*bright?1:.3);let p=0;
 for(let i=0;i<len;i++){const a=d[p],b=d[(p+1)%N];const v=.4985*(a+b);d[p]=v;buf[i]=a;p=(p+1)%N;}return buf;}
function tone(m){if(cache[m])return cache[m];const sr=AC.sampleRate,len=Math.round(sr*1.6),b=AC.createBuffer(2,len,sr);
 const f=440*Math.pow(2,(m-69)/12),A=ks(f,sr,len,1),B=ks(f*1.003,sr,len,1),O=m<57?ks(f*2.004,sr,len,1):null;
 for(let ch=0;ch<2;ch++){const o=b.getChannelData(ch);for(let i=0;i<len;i++){let v=(ch?A[i]*.6+B[i]*.4:A[i]*.4+B[i]*.6);if(O)v=v*.7+O[i]*.45;
  const att=i<sr*.004?(i/(sr*.004)):1;o[i]=v*att*.55;}}return cache[m]=b;}
function play(e){if(!AC)return;const s=AC.createBufferSource();s.buffer=tone(OPEN[e.course]+e.fret);const hp=AC.createBiquadFilter();hp.type='peaking';hp.frequency.value=3200;hp.gain.value=6;
 const gn=AC.createGain();const t=AC.currentTime,d=Math.max(.25,e.dur/speed)+.15;gn.gain.setValueAtTime(1,t);gn.gain.setTargetAtTime(0,t+d,.06);
 s.connect(hp).connect(gn).connect(AC.destination);s.start(t);s.stop(t+d+.5);}

function step(now){const dt=Math.min(.1,(now-last_t)/1000);last_t=now;if(!evs){bg();drawNeck();requestAnimationFrame(step);return;}
 if(playing){T+=dt*speed;while(idx+1<evs.length&&evs[idx+1].t<=T){idx++;const e=evs[idx];play(e);burst();
   if(e.chord!==cur){cur=e.chord;slide=0;}nxt=e.next;}
  if(T>evs[evs.length-1].t+evs[evs.length-1].dur+1){playing=false;setBtn();}}
 slide=Math.min(1,slide+dt*4);for(const p of parts){p.x+=p.vx*dt;p.y+=p.vy*dt;p.l-=dt*2.2;}parts=parts.filter(p=>p.l>0);
 // pan neck for high frets
 const look=evs.slice(Math.max(0,idx),idx+4).map(e=>fx(e.fret));const mx=look.length?Math.max(...look):0;
 X0t=Math.max(250,Math.min(1832-VIEW,mx+90-VIEW));X0+=(X0t-X0)*Math.min(1,dt*6);
 bg();drawNeck();drawDot();drawTab();drawChords();requestAnimationFrame(step);}
// ---- UI ----
const $=id=>document.getElementById(id),btn=$('play');
function setBtn(){btn.textContent=playing?'❚❚':'▶';}
function setSpeed(v){speed=v/100;$('spd').value=v;$('sv').textContent=v+'%';document.querySelectorAll('.chip').forEach(c=>c.classList.toggle('on',+c.dataset.v===+v));}
$('spd').oninput=e=>setSpeed(+e.target.value);document.querySelectorAll('.chip').forEach(c=>c.onclick=()=>setSpeed(+c.dataset.v));
btn.onclick=()=>{if(!AC){AC=new (window.AudioContext||window.webkitAudioContext)();}AC.resume&&AC.resume();
 if(!evs)return;if(!playing&&idx>=evs.length-1){T=-1;idx=-1;cur=null;}playing=!playing;setBtn();};
function load(s){const er=validate(s);document.querySelectorAll('#songs button').forEach(b=>b.classList.toggle('on',b.dataset.id===s.id));
 playing=false;setBtn();if(er.length){evs=null;$('err').style.display='block';$('err').innerHTML='<b>השיר לא תקין — לא מנגנים</b><br>'+er.slice(0,8).join('<br>');return;}
 $('err').style.display='none';song=s;evs=s.events;T=-1.2;idx=-1;cur=evs[0].chord;nxt=evs[0].next;slide=1;}
DATA.songs.forEach(s=>{const b=document.createElement('button');b.textContent='♪ '+s.title;b.dataset.id=s.id;b.onclick=()=>load(s);$('songs').appendChild(b);});
window.loadSong=json=>load(typeof json==='string'?JSON.parse(json):json);
function fit(){const sc=Math.min(innerWidth/1080,innerHeight/1920);$('stage').style.transform=`scale(${sc})`;$('wrap').style.height=1920*sc+'px';}
addEventListener('resize',fit);fit();load(DATA.songs[0]);setSpeed(75);requestAnimationFrame(step);
